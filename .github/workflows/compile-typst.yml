name: Auto Compile Typst PDF

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Compile Typst Document
        run: |
          mkdir -p output
          typst compile docs/main.typ output/Project_Charter.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Project_Charter_PDF
          path: output/Project_Charter.pdf