# Smart Intersection — Mosquitto 2.x тохиргоо
# Issue: [1.2.2] MQTT broker (Mosquitto) тохируулах (#9)

# --- Хадгалалт ---
# QoS 1 мессеж ба retain (state, status, config) broker дахин асахад алдагдахгүй.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# --- Лог ---
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# --- Listener ---
# 1883: ESP32 ба backend (MQTT/TCP)
listener 1883 0.0.0.0
protocol mqtt

# 9001: Dashboard (браузераас MQTT over WebSocket)
listener 9001 0.0.0.0
protocol websockets

# --- Нэвтрэлт ба эрх (бүх listener-д нэгэн адил) ---
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# --- Хязгаарлалт ---
max_keepalive 120
max_inflight_messages 20
max_queued_messages 1000
message_size_limit 4096
