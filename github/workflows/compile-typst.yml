name: Auto Compile Typst PDF

on:
  push:
    branches: [ main ]


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Compile Typst Document
        run: typst compile docs/main.typ docs/Project_Charter.pdf

      - name: Commit and Push PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: Auto-update Project_Charter.pdf"
          file_pattern: docs/Project_Charter.pdf